name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      debuggable:
        description: "Build a DEBUG apk with WebView debugging (chrome://inspect). Leave off for the production RELEASE apk."
        type: boolean
        default: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Choose build type
        run: |
          if [ "${{ github.event.inputs.debuggable }}" = "true" ]; then
            echo "BUILD_TYPE=Debug" >> "$GITHUB_ENV"
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "APK_LABEL=debug" >> "$GITHUB_ENV"
          else
            echo "BUILD_TYPE=Release" >> "$GITHUB_ENV"
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "APK_LABEL=release" >> "$GITHUB_ENV"
          fi
          echo "Building: $(grep BUILD_TYPE "$GITHUB_ENV")"

      - name: Unzip app into www
        run: |
          echo "All zips in repo:"
          git ls-files | grep -i '\.zip$' || true
          ZIP=$(git ls-files | grep -i '\.zip$' | while read -r f; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -rn | head -n 1 | cut -d' ' -f2-)
          echo "Using newest zip: $ZIP"
          test -n "$ZIP"
          mkdir -p www
          unzip -oq "$ZIP" -d www
          if [ ! -f www/index.html ]; then
            SUB=$(find www -maxdepth 2 -name index.html | head -n 1 | xargs dirname)
            cp -a "$SUB"/. www/
          fi
          test -f www/index.html
          rm -rf www/supabase
          mkdir -p tools
          cp -f www/ci/optimize-web.py tools/ 2>/dev/null || echo "::warning::ci/optimize-web.py not in this zip - assets will not be bundled"
          rm -rf www/ci www/.github
          echo "Build tag in this zip:"
          grep -n "BUILD_TAG =" www/js/features/download-manager.js
          echo "Native folder check:"
          test -f www/native/android/KRDownloaderPlugin.java
          test -f www/native/android/MainActivity.java
          test -f www/native/android/open-with-filter.xml
          test -f www/js/features/library-screen.js
          for f in MuReaderActivity MuPdfView MuAnnot MuAnnotStore MuInk MuSnap MuDock MuEraser MuMultiActivity; do
            test -f www/native/android/$f.java || echo "::warning::$f.java missing - the build will use the pdf.js reader"
          done

      - name: Capacitor setup
        run: |
          echo '{"name":"maktabah","version":"1.0.0","private":true}' > package.json
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF2'
          {
            "appId": "com.maktabah.kaif",
            "appName": "Maktabah",
            "webDir": "www"
          }
          EOF2
          npx cap add android

      - name: Bundle offline library (Supabase)
        continue-on-error: true
        run: |
          npm i --omit=optional @supabase/supabase-js@2 esbuild
          mkdir -p www/vendor
          echo "export { createClient } from '@supabase/supabase-js';" > vendor-entry.js
          npx esbuild vendor-entry.js --bundle --format=esm --minify --platform=browser --outfile=www/vendor/supabase.js
          echo "Vendor files:"
          ls -la www/vendor

      - name: Bundle offline fonts (Noto Naskh Arabic + Plus Jakarta Sans)
        continue-on-error: true
        run: |
          npm i --omit=optional @fontsource-variable/noto-naskh-arabic @fontsource-variable/plus-jakarta-sans
          for p in noto-naskh-arabic plus-jakarta-sans; do
            [ -d node_modules/@fontsource-variable/$p ] || continue
            mkdir -p www/vendor/fonts/$p
            cp -r node_modules/@fontsource-variable/$p/files www/vendor/fonts/$p/files
            cp node_modules/@fontsource-variable/$p/index.css www/vendor/fonts/$p/index.css
          done
          python3 - <<'PY'
          import re, os, glob
          keep = {"latin", "arabic"}
          for css in glob.glob("www/vendor/fonts/*/index.css"):
              d = os.path.dirname(css)
              t = open(css, encoding="utf-8").read()
              blocks = re.findall(r"(/\*\s*([\w-]+)\s*\*/\s*@font-face\s*\{.*?\})", t, flags=re.S)
              if not blocks:
                  print("no subset blocks in", css, "- keeping all"); continue
              out = "\n".join(b for b, name in blocks if name in keep) + "\n"
              used = set(re.findall(r"files/([^)'\"]+)", out))
              for f in glob.glob(d + "/files/*"):
                  if os.path.basename(f) not in used:
                      os.remove(f)
              open(css, "w", encoding="utf-8").write(out)
              print(css, "kept", sorted(used))
          PY
          python3 - <<'PY'
          import re, os
          p = "www/index.html"
          s = open(p, encoding="utf-8").read()
          local = ('<link rel="stylesheet" href="./vendor/fonts/noto-naskh-arabic/index.css">\n  '
                   '<link rel="stylesheet" href="./vendor/fonts/plus-jakarta-sans/index.css">')
          s2 = re.sub(r'<link rel="stylesheet" href="https://fonts\.googleapis\.com[^>]*>', lambda m: local, s)
          s2 = re.sub(r'\s*<link rel="preconnect" href="https://fonts\.(googleapis|gstatic)\.com"[^>]*>', '', s2)
          open(p, "w", encoding="utf-8").write(s2)
          print("fonts link swapped:", s2 != s)
          PY
          echo "Font files:"
          ls www/vendor/fonts/*/files | head -20
          grep -n "vendor/fonts" www/index.html || true

      - name: Native Android plugin (Downloads, reader, Open with)
        run: |
          DEST=android/app/src/main/java/com/maktabah/kaif
          cp www/native/android/*.java "$DEST"/
          mkdir -p android/app/src/main/assets/fonts
          cp www/assets/fonts/NotoNastaliqUrdu-Regular.ttf android/app/src/main/assets/fonts/
          ls -la android/app/src/main/assets/fonts
          cp -r www/native/android/res/. android/app/src/main/res/
          ls -la "$DEST"
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          f = open("www/native/android/open-with-filter.xml").read()
          if "application/pdf" not in s:
              s = s.replace("</activity>", f + "        </activity>", 1)
          if "MuMultiActivity" not in s:
              multi = ('        <activity android:name=".MuMultiActivity" android:exported="false"'
                       ' android:launchMode="singleTask" android:taskAffinity="com.maktabah.kaif.multi"'
                       ' android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|uiMode"'
                       ' android:windowSoftInputMode="adjustResize"'
                       ' android:theme="@android:style/Theme.DeviceDefault.NoActionBar" />\n'
                       '        <receiver android:name=".KRMultiWidget" android:exported="false">\n'
                       '            <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>\n'
                       '            <meta-data android:name="android.appwidget.provider" android:resource="@xml/kr_multi_widget_info" />\n'
                       '        </receiver>\n')
              s = s.replace("</application>", multi + "    </application>", 1)
          if "MANAGE_EXTERNAL_STORAGE" not in s:
              perms = (
                  '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n'
                  '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n'
              )
              s = s.replace("<application", '<application android:requestLegacyExternalStorage="true"', 1)
              s = s.replace("<application", perms + "    <application", 1)
          open(p, "w").write(s)
          PY
          rm -rf www/native
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />#' "$MF"
          cat "$MF"

      - name: Native pull-to-refresh dependency
        run: |
          python3 - <<'PY'
          p = "android/app/build.gradle"
          s = open(p).read()
          dep = 'implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"'
          if "swiperefreshlayout" not in s:
              s = s.replace("dependencies {", "dependencies {\n    " + dep, 1)
              open(p, "w").write(s)
          PY
          grep -n "swiperefreshlayout" android/app/build.gradle

      - name: MuPDF native reader (dependency + activity)
        run: |
          META=$(curl -fsSL https://maven.ghostscript.com/com/artifex/mupdf/fitz/maven-metadata.xml || true)
          VER=$(echo "$META" | grep -o '<version>1\.24\.[0-9]*</version>' | sed 's/<[^>]*>//g' | sort -V | tail -1)
          if [ -z "$VER" ]; then VER=1.24.10; fi
          echo "Using MuPDF fitz $VER"
          echo "$VER" > mupdf-version.txt
          python3 - <<'PY'
          import re
          ver = open("mupdf-version.txt").read().strip()
          r = "android/build.gradle"
          rs = open(r).read()
          repo = "maven { url 'https://maven.ghostscript.com/' }"
          if "maven.ghostscript.com" not in rs:
              rs = rs.replace("mavenCentral()", "mavenCentral()\n        " + repo)
              open(r, "w").write(rs)
          p = "android/app/build.gradle"
          s = open(p).read()
          dep = 'implementation "com.artifex.mupdf:fitz:%s"' % ver
          if "com.artifex.mupdf:fitz" not in s:
              s = s.replace("dependencies {", "dependencies {\n    " + dep, 1)
              open(p, "w").write(s)
          m = "android/app/src/main/AndroidManifest.xml"
          t = open(m).read()
          act = ('        <activity android:name=".MuReaderActivity" android:exported="false"'
                 ' android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|uiMode"'
                 ' android:theme="@android:style/Theme.DeviceDefault.NoActionBar" />\n')
          if "MuReaderActivity" not in t:
              t = t.replace("</application>", act + "    </application>", 1)
              open(m, "w").write(t)
          PY
          grep -n "ghostscript" android/build.gradle
          grep -n "fitz\|swiperefresh" android/app/build.gradle
          grep -n "MuReaderActivity" android/app/src/main/AndroidManifest.xml

      - name: App icon
        continue-on-error: true
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          IM=$(command -v magick || command -v convert)
          ICON=www/assets/icons/icon-512.png
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}
            s=${d##*:}
            $IM $ICON -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_round.png
          done

      - name: Native splash (matches the in-app splash)
        continue-on-error: true
        run: |
          python3 www/assets/splash/setup_splash.py
          rm -rf www/assets/splash

      - name: Smaller APK (single CPU architecture)
        run: |
          python3 - <<'PY'
          import os
          p = "android/app/build.gradle"
          s = open(p).read()
          abis = ", ".join('"%s"' % a.strip() for a in os.environ["ABIS"].split(","))
          if "abiFilters" not in s:
              s = s.replace("defaultConfig {", "defaultConfig {\n        ndk { abiFilters %s }" % abis, 1)
              open(p, "w").write(s)
          PY
          grep -n "abiFilters" android/app/build.gradle
        env:
          ABIS: "arm64-v8a"

      - name: Stable signing key + version code
        run: |
          mkdir -p ~/.android
          KS=""; SRC=""
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            KS="$HOME/.android/debug.keystore"; SRC="secret DEBUG_KEYSTORE_B64"
          else
            if [ -f keystore/debug.keystore ]; then
              KS="$GITHUB_WORKSPACE/keystore/debug.keystore"
            elif [ -f keystore ]; then
              KS="$GITHUB_WORKSPACE/keystore"
            else
              F=$(git ls-files | grep -iE '\.(keystore|jks)$' | head -n 1 || true)
              if [ -n "$F" ]; then KS="$GITHUB_WORKSPACE/$F"; fi
            fi
            if [ -n "$KS" ]; then
              SRC="repo file ${KS#$GITHUB_WORKSPACE/}"
            else
              mkdir -p keystore
              keytool -genkeypair -storetype pkcs12 -keystore keystore/debug.keystore \
                -storepass android -keypass android -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 36500 \
                -dname "CN=Android Debug,O=Android,C=US"
              git config user.name "github-actions"
              git config user.email "actions@github.com"
              git add -f keystore/debug.keystore
              git commit -m "Add stable debug keystore"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
              if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "::warning::Could not save the keystore to the repo - the next build will get a NEW signature (old app must be uninstalled)."
              fi
              KS="$GITHUB_WORKSPACE/keystore/debug.keystore"; SRC="newly generated (first run)"
            fi
          fi
          PASS="${KEYSTORE_PASSWORD:-android}"
          if ! LIST=$(keytool -list -keystore "$KS" -storepass "$PASS" 2>&1); then
            echo "::error::Cannot open keystore ($SRC). If it has its own password, add repo secrets KEYSTORE_PASSWORD (and KEY_ALIAS / KEY_PASSWORD if different)."
            echo "$LIST" | head -5
            exit 1
          fi
          ALIAS="${KEY_ALIAS:-$(echo "$LIST" | grep -m1 'PrivateKeyEntry' | cut -d, -f1)}"
          [ -n "$ALIAS" ] || { echo "::error::No private key found in keystore ($SRC)"; exit 1; }
          KPASS="${KEY_PASSWORD:-$PASS}"
          KS_SHA=$(keytool -list -v -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-Z' 'a-z')
          [ -n "$KS_SHA" ] || { echo "::error::Alias $ALIAS not found in keystore"; exit 1; }
          echo "Keystore: $SRC (alias $ALIAS)"
          echo "Keystore SHA-256: $KS_SHA"
          {
            echo "KS_PATH=$KS"
            echo "KS_SHA=$KS_SHA"
            echo "KS_SRC=$SRC"
          } >> "$GITHUB_ENV"
          export KS_PATH="$KS" KS_ALIAS="$ALIAS" KS_PASS="$PASS" KS_KPASS="$KPASS"
          export VERSION_CODE=$(( $(date +%s) / 60 ))
          python3 - <<'PY'
          import os, re
          def q(v): return v.replace("\\", "\\\\").replace("'", "\\'")
          p = "android/app/build.gradle"
          s = open(p).read()
          n = os.environ["RUN_NUMBER"]
          s2 = re.sub(r"versionCode\s+\d+", "versionCode " + os.environ["VERSION_CODE"], s, count=1)
          s2 = re.sub(r'versionName\s+"[^"]*"', 'versionName "1.0.' + n + '"', s2, count=1)
          if "KR_STABLE_SIGNING" not in s2:
              cfg = ("            storeFile file('" + q(os.environ["KS_PATH"]) + "')\n"
                     "            storePassword '" + q(os.environ["KS_PASS"]) + "'\n"
                     "            keyAlias '" + q(os.environ["KS_ALIAS"]) + "'\n"
                     "            keyPassword '" + q(os.environ["KS_KPASS"]) + "'\n")
              blk = ("\n    // KR_STABLE_SIGNING\n    signingConfigs {\n        debug {\n" + cfg + "        }\n"
                     "        release {\n" + cfg + "        }\n    }\n"
                     "    lint { checkReleaseBuilds false; abortOnError false }\n")
              s2 = s2.replace("android {", "android {" + blk, 1)
          if "signingConfig signingConfigs.release" not in s2:
              s3 = re.sub(r"(buildTypes\s*\{\s*release\s*\{)", r"\1\n            signingConfig signingConfigs.release", s2, count=1)
              if s3 == s2:
                  s3 = s2.replace("android {", "android {\n    buildTypes { release { signingConfig signingConfigs.release } }", 1)
              s2 = s3
          open(p, "w").write(s2)
          print("build.gradle patched")
          PY
          grep -n "versionCode\|versionName\|KR_STABLE_SIGNING\|storeFile\|signingConfig" android/app/build.gradle
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}

      - name: Optimize web assets (bundle + minify)
        continue-on-error: true
        run: |
          test -f tools/optimize-web.py || { echo "::warning::no optimizer - skipping"; exit 0; }
          npm i --no-save --omit=optional esbuild
          python3 tools/optimize-web.py www
          ls -la www/css www/js

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew assemble$BUILD_TYPE 2>&1 | tee ../build1.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -eq 0 ]; then exit 0; fi
          echo "::warning::Build with the MuPDF reader FAILED - rebuilding WITHOUT it (the pdf.js reader will be used)."
          echo "## MuPDF build failed - APK was rebuilt without the MuPDF reader" >> "$GITHUB_STEP_SUMMARY"
          echo "Send these lines to Claude:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|\.java:[0-9]+|What went wrong|Could not|not found|FAILED" ../build1.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rm -f app/src/main/java/com/maktabah/kaif/MuPdfView.java app/src/main/java/com/maktabah/kaif/MuReaderActivity.java app/src/main/java/com/maktabah/kaif/MuDock.java app/src/main/java/com/maktabah/kaif/MuMultiActivity.java
          python3 -c "import re;p='app/build.gradle';s=open(p).read();s=re.sub(r'\n\s*implementation \"com\.artifex\.mupdf:fitz:[^\"]*\"','',s);open(p,'w').write(s);m='app/src/main/AndroidManifest.xml';t=open(m).read();t=re.sub(r'\s*<activity android:name=\"\.Mu(Reader|Multi)Activity\"[^>]*/>','',t);open(m,'w').write(t)"
          ./gradlew assemble$BUILD_TYPE

      - name: Show APK signature
        run: |
          APKSIGNER=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n 1)
          OUT=$("$APKSIGNER" verify --print-certs "$APK_PATH" | grep -i "SHA-256" | head -n 1)
          APK_SHA=$(echo "$OUT" | sed 's/.*: *//' | tr -d ': ' | tr 'A-Z' 'a-z')
          echo "$OUT"
          {
            echo "## APK signature (must be the same on every build) - $APK_LABEL build"
            echo "$OUT"
            echo ""
            echo "Keystore: $KS_SRC"
            echo "versionCode: $(grep -m1 -o 'versionCode [0-9]*' android/app/build.gradle)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$APK_SHA" != "$KS_SHA" ]; then
            echo "::error::APK is not signed with the chosen keystore - updates over the old app will fail."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Maktabah-APK-${{ github.run_number }}-${{ env.APK_LABEL }}
          path: ${{ env.APK_PATH }}
